version: 2

sources:
  - name: raw
    description: Raw tables as loaded into the warehouse, untouched (by Airbyte on PostgreSQL, by Fivetran on Snowflake).
    database: "{{ target.database if target.type == 'snowflake' else none }}"
    schema: "{{ 'NEON_CLASSROOM_PUBLIC' if target.type == 'snowflake' else 'raw' }}"
    tables:
      - name: customers
      - name: orders
        loaded_at_field: "{{ '_fivetran_synced' if target.type == 'snowflake' else '_airbyte_extracted_at' }}"
        freshness:
          warn_after: {count: 2, period: day}
      - name: order_items
      - name: products
      - name: stores
      - name: employees
