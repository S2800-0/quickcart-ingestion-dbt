# Connection to the warehouse database. Values come from the environment, with the
# local demo defaults used by setup_source.sh.
quickcart:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5440') | as_number }}"
      user: "{{ env_var('DBT_USER', 'quickcart') }}"
      password: "{{ env_var('DBT_PASSWORD', 'quickcart_demo') }}"
      dbname: quickcart_warehouse
      schema: analytics
      threads: 4

    # The same models on Snowflake, reading the tables Fivetran loaded from Neon.
    # Key pair login for the FIVETRAN_USER service user created in sql/03_snowflake_fivetran_setup.sql.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'srsbxdh-uf12982') }}"
      user: FIVETRAN_USER
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', env_var('HOME') ~ '/.quickcart_keys/rsa_key.p8') }}"
      role: FIVETRAN_ROLE
      warehouse: FIVETRAN_WAREHOUSE
      database: FIVETRAN_DATABASE
      schema: ANALYTICS
      threads: 4

    # The same models on the tables Airbyte Cloud loaded into AIRBYTE_DATABASE.
    snowflake_airbyte:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'srsbxdh-uf12982') }}"
      user: AIRBYTE_USER
      private_key_path: "{{ env_var('AIRBYTE_PRIVATE_KEY_PATH', env_var('HOME') ~ '/.quickcart_keys/airbyte_key.p8') }}"
      role: AIRBYTE_ROLE
      warehouse: AIRBYTE_WAREHOUSE
      database: AIRBYTE_DATABASE
      schema: ANALYTICS
      threads: 4
